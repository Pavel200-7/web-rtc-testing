  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    restart: unless-stopped
    command: --dev --config /etc/livekit/livekit.yaml 
    volumes:
      - ./config/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50002:50000-50002/udp"  # Важно для RTC трафика
      - "3478:3478"
    networks:
      - app-net
      
  livekit-dashboard:
    image: mrgreen007/livekit-dashboard:latest
    container_name: livekit-dashboard
    restart: always
    ports:
      - "8000:8000"
    environment:
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - APP_SECRET_KEY=random_string
      - CSP_CONNECT_SRC='self' https://cdn.jsdelivr.net
    networks:
      - app-net

